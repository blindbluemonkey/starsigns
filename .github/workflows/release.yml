name: Build & release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v1.1)'
        required: true
        default: 'v1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "StarSigns-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: StarSigns-apk
          path: StarSigns-*.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Star Signs ${{ env.VERSION }}
          files: StarSigns-*.apk
          body: |
            **Install:** download the APK on your Android phone (8.0 or later), open it, and allow installs from unknown sources when asked.

            **Use it:** point the phone at the night sky. The star sign nearest the centre of the screen lights up. If the drawing doesn't quite sit on the real stars, drag it into place.

            **Privacy:** the app has no internet permission. Camera and location are only used on the phone.
